name: Build CloudPost Multi-Platform Desktop

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (clean cross-platform)
        run: |
          npm install -g npm@latest
          rm -f package-lock.json
          npm install
          chmod -R +x node_modules/.bin || true
          chmod -R +x node_modules/app-builder-bin || true
          chmod -R +x node_modules/7zip-bin || true

      - name: Disable Spotlight indexing (prevents hdiutil volume locks)
        run: |
          sudo mdutil -a -i off || true

      - name: Build macOS DMG and ZIP
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudPost-macOS
          path: |
            dist_desktop/*.dmg
            dist_desktop/*.zip

  build-windows:
    name: Build Windows (.exe & portable)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (clean cross-platform)
        shell: bash
        run: |
          npm install -g npm@latest
          rm -f package-lock.json
          npm install

      - name: Build Windows Executables
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudPost-Windows
          path: |
            dist_desktop/*.exe

  publish-release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CloudPost-macOS
          path: release_artifacts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CloudPost-Windows
          path: release_artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.dmg
            release_artifacts/*.zip
            release_artifacts/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
