  <head>
    <meta charset="UTF-8" />

    <meta property="og:description" content="Enterprise-grade API client & collaborative platform featuring WebSockets real-time tester, Mock Server engine, GraphQL Explorer with schema introspection, Collection Monitors for SLA tracking, SaaS multi-tenant reporting, hierarchical collections, and multi-language code generation." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0f1117] text-[#e1e4ea] font-sans antialiased overflow-hidden selection:bg-orange-500/30 selection:text-orange-200">
    <div id="root"></div>
    <script>
      // 1. Ensure .php extension is never displayed in the browser address bar
      try {
        if (window.location.pathname.endsWith('.php') || window.location.pathname.includes('.php/')) {
          var cleanPath = window.location.pathname.replace(/\.php(\/|$)/, '$1') || '/';
          window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
        }
      } catch (e) {}

      // 2. Zero-Leak Status Bar: Ensure URL can never be displayed in status bar when hovering any anchor tag
      window.defaultStatus = '';
      document.addEventListener('mouseover', function(e) {
        window.status = '';
        var t = e.target && e.target.closest ? e.target.closest('a') : null;
        if (t && t.hasAttribute('href') && !t.hasAttribute('data-real-href')) {
          var realHref = t.getAttribute('href');
          if (realHref && !realHref.startsWith('javascript:')) {
            t.setAttribute('data-real-href', realHref);
            t.removeAttribute('href');
            t.style.cursor = 'pointer';
            t.addEventListener('click', function(ev) {
              if (ev.defaultPrevented) return;
              if (realHref && realHref !== '#' && realHref.trim() !== '') {
                if (window.electronAPI && window.electronAPI.openExternal && /^https?:\/\//.test(realHref)) {
                  ev.preventDefault();
                  window.electronAPI.openExternal(realHref);
                } else if (t.target === '_blank') {
                  ev.preventDefault();
                  window.open(realHref, '_blank', 'noopener,noreferrer');
                } else if (!realHref.startsWith('#')) {
                  window.location.href = realHref;
                }
              }
            });
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
